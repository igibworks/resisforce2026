<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Shield protecting against microbes">
  <defs>
    <radialGradient id="orb" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#3aa9ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#3aa9ff" stop-opacity=".04"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4a7a"/><stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe9ff"/><stop offset="1" stop-color="#2de2c0"/>
    </linearGradient>
    <radialGradient id="vr" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff8aa0"/><stop offset="1" stop-color="#8a1c3c"/>
    </radialGradient>
    <radialGradient id="vp" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#c79bff"/><stop offset="1" stop-color="#4b1f8f"/>
    </radialGradient>
    <g id="virus-spikes" stroke-width="4" stroke-linecap="round">
      <g id="spk"><line x1="0" y1="-30" x2="0" y2="-42"/><circle cx="0" cy="-45" r="3.2" stroke="none"/></g>
      <use href="#spk" transform="rotate(30)"/><use href="#spk" transform="rotate(60)"/><use href="#spk" transform="rotate(90)"/>
      <use href="#spk" transform="rotate(120)"/><use href="#spk" transform="rotate(150)"/><use href="#spk" transform="rotate(180)"/>
      <use href="#spk" transform="rotate(210)"/><use href="#spk" transform="rotate(240)"/><use href="#spk" transform="rotate(270)"/>
      <use href="#spk" transform="rotate(300)"/><use href="#spk" transform="rotate(330)"/>
    </g>
    <g id="bacillus">
      <rect x="-48" y="-14" width="96" height="28" rx="14"/>
    </g>
  </defs>

  <!-- shield sphere -->
  <circle cx="300" cy="300" r="190" fill="url(#orb)" stroke="#6fd3ff" stroke-opacity=".6" stroke-width="2"/>
  <ellipse cx="300" cy="440" rx="190" ry="26" fill="none" stroke="#2de2c0" stroke-opacity=".6" stroke-width="2"/>
  <ellipse cx="300" cy="300" rx="215" ry="70" fill="none" stroke="#6fd3ff" stroke-opacity=".35" stroke-dasharray="6 8" transform="rotate(-18 300 300)"/>

  <!-- shield -->
  <path d="M300 190 392 222v78c0 58-40 98-92 120-52-22-92-62-92-120v-78z" fill="url(#sh)" stroke="url(#rim)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M300 190v230c-52-22-92-62-92-120v-78z" fill="#fff" opacity=".05"/>
  <polygon points="300,262 336,283 336,325 300,346 264,325 264,283" fill="#0b2a4a" stroke="#f5c36b" stroke-width="5"/>
  <path d="M293 291h14v13h13v14h-13v13h-14v-13h-13v-14h13z" fill="#ffe9b0"/>

  <!-- microbes -->
  <g class="m" fill="url(#vr)" stroke="#ff5d7e" transform="translate(110 120) scale(1.0)">
    <circle r="30"/><use href="#virus-spikes" fill="#ff5d7e"/>
  </g>
  <g fill="url(#vp)" stroke="#a46bff" transform="translate(470 110) scale(.85)">
    <circle r="30"/><use href="#virus-spikes" fill="#a46bff"/>
  </g>
  <g fill="url(#vr)" stroke="#ff5d7e" transform="translate(500 400) scale(.9)">
    <circle r="30"/><use href="#virus-spikes" fill="#ff5d7e"/>
  </g>
  <g fill="url(#vp)" stroke="#a46bff" transform="translate(95 430) scale(.75)">
    <circle r="30"/><use href="#virus-spikes" fill="#a46bff"/>
  </g>
  <g fill="url(#vp)" opacity=".9" transform="translate(300 55) rotate(-12) scale(1.1)"><use href="#bacillus"/></g>
  <g fill="url(#vr)" opacity=".9" transform="translate(535 270) rotate(70) scale(.9)"><use href="#bacillus"/></g>
  <g fill="url(#vp)" opacity=".75" transform="translate(60 285) rotate(25) scale(.8)"><use href="#bacillus"/></g>
  <g fill="url(#vr)" opacity=".7" transform="translate(300 555) rotate(8) scale(.8)"><use href="#bacillus"/></g>

  <!-- orbit nodes -->
  <g fill="#fff"><circle cx="165" cy="215" r="4"/><circle cx="440" cy="195" r="4"/><circle cx="455" cy="395" r="4"/><circle cx="170" cy="395" r="4"/></g>
</svg>
